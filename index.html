<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      NOTE: Update this canonical URL to the final deployed domain
      (e.g. Vercel/Netlify/Cloudflare Pages URL) before going live.
    -->
    <link rel="canonical" href="https://mcst-concept.example.com/" />
    <title><!-- figma:title --></title>
    <!--
      GitHub Pages SPA fallback: when a deep link (e.g. /programs) is opened
      directly or the page is refreshed, GitHub Pages serves public/404.html,
      which redirects here with the intended path encoded in the query
      string. This restores the real URL before React Router mounts. See
      https://github.com/rafgraph/spa-github-pages for the technique.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
