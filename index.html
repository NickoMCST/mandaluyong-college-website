    <!-- Open Graph tags for link previews and site name signal -->
    <meta property="og:site_name" content="MCST Unofficial Student Project" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nickomcst.github.io/mandaluyong-college-website/" />

    <!--
      GitHub Pages SPA fallback: when a deep link (e.g. /programs) is opened
      directly or the page is refreshed, GitHub Pages serves public/404.html,
      which redirects here with the intended path encoded in the query
      string. This restores the real URL before React Router mounts. See
      https://github.com/rafgraph/spa-github-pages for the technique.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MCST Unofficial Student Project",
      "alternateName": "Mandaluyong College of Science and Technology – Unofficial Student Web Project",
      "url": "https://nickomcst.github.io/mandaluyong-college-website/",
      "description": "Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources.",
      "publisher": {
        "@type": "Person",
        "name": "Nicko"
      },
      "isPartOf": {
        "@type": "CreativeWork",
        "name": "Student Portfolio Project",
        "about": "Mandaluyong College of Science and Technology"
      }
    }
    </script>

      );
    </script>
