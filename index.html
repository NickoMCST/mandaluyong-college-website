  <head>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <!--
      NOTE: Confirm this canonical URL matches your actual deployed domain.
    -->
    <link rel="canonical" href="https://nickomcst.github.io/mandaluyong-college-website/" />

    <title>Mandaluyong College of Science and Technology – Unofficial Student Web Project</title>
    <meta name="description" content="Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources." />

    <!-- Open Graph tags for link previews and site name signal -->
    <meta property="og:site_name" content="MCST Unofficial Student Project" />
    <meta property="og:title" content="Mandaluyong College of Science and Technology – Unofficial Student Web Project" />
    <meta property="og:description" content="Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nickomcst.github.io/mandaluyong-college-website/" />

    <!--
      GitHub Pages SPA fallback: when a deep link (e.g. /programs) is opened
      directly or the page is refreshed, GitHub Pages serves public/404.html,
      which redirects here with the intended path encoded in the query
      string. This restores the real URL before React Router mounts. See
      https://github.com/rafgraph/spa-github-pages for the technique.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MCST Unofficial Student Project",
      "alternateName": "Mandaluyong College of Science and Technology – Unofficial Student Web Project",
      "url": "https://nickomcst.github.io/mandaluyong-college-website/",
      "description": "Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources.",
      "publisher": {
        "@type": "Person",
        "name": "Nicko"
      },
      "isPartOf": {
        "@type": "CreativeWork",
        "name": "Student Portfolio Project",
        "about": "Mandaluyong College of Science and Technology"
      }
    }
    </script>

    <!-- Security Warning in Console -->
    <script type="text/javascript">
      console.log(
        "%cStop!",
        "color: red; font-size: 60px; font-weight: bold; text-shadow: 1px 1px 0 #000;"
      );
      console.log(
        "%cThis is a browser feature intended for developers. If someone told you to copy-paste something here to enable a feature or \"hack\" an account, it's a scam and could give them access to your account.",
        "font-size: 16px;"
      );
      console.log(
        "%cIf you're a developer curious about this site, contact Nicko (NickoMCST) on GitHub: https://github.com/NickoMCST",
        "font-size: 14px; color: #999;"
      );
      console.log(
        "%c⚠️ SECURITY NOTICE: This website has security protections enabled.",
        "color: #ff6b6b; font-size: 14px; font-weight: bold;"
      );
    </script>

    <!-- IMMEDIATE SECURITY PROTECTIONS (before page render) -->
    <script type="text/javascript">
      // Prevent DevTools from opening
      window.addEventListener('keydown', function(e) {
        // F12
        if (e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+I or Cmd+Shift+I
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode === 73) {
          e.preventDefault();
          showSecurityNotification('Inspector tools are disabled on this website.');
          return false;
        }
        // Ctrl+Shift+J or Cmd+Shift+J
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode === 74) {
          e.preventDefault();
          showSecurityNotification('Console access is disabled on this website.');
          return false;
        }
        // Ctrl+Shift+C or Cmd+Shift+C
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode === 67) {
          e.preventDefault();
          showSecurityNotification('Element picker is disabled on this website.');
          return false;
        }
        // Ctrl+S or Cmd+S - SAVE
        if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) {
          e.preventDefault();
          showSecurityNotification('Save functionality is disabled for security purposes.');
          return false;
        }
        // Ctrl+P or Cmd+P - PRINT
        if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) {
          e.preventDefault();
          showSecurityNotification('Print functionality is restricted on this website.');
          return false;
        }
      }, true);

      // Prevent right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showSecurityNotification('Right-click is disabled on this website for security purposes.');
        return false;
      }, true);

      // Prevent text selection
      document.addEventListener('selectstart', function(e) {
        e.preventDefault();
        return false;
      }, true);

      // Prevent copy
      document.addEventListener('copy', function(e) {
        e.preventDefault();
        showSecurityNotification('Copying content is disabled on this website.');
        return false;
      }, true);

      // Prevent cut
      document.addEventListener('cut', function(e) {
        e.preventDefault();
        return false;
      }, true);

      // Prevent paste
      document.addEventListener('paste', function(e) {
        e.preventDefault();
        return false;
      }, true);

      // Detect DevTools
      let devToolsOpen = false;
      setInterval(function() {
        let threshold = 160;
        if (
          window.outerHeight - window.innerHeight > threshold ||
          window.outerWidth - window.innerWidth > threshold
        ) {
          if (!devToolsOpen) {
            devToolsOpen = true;
            console.clear();
            showSecurityNotification('Developer tools access detected and blocked.');
          }
        } else {
          devToolsOpen = false;
        }
      }, 500);

      // Disable browser context menu
      window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      }, false);

      // Apply CSS protections
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.style.userSelect = 'none';
        document.documentElement.style.webkitUserSelect = 'none';
        document.documentElement.style.msUserSelect = 'none';
        document.documentElement.style.mozUserSelect = 'none';
        
        document.body.style.userSelect = 'none';
        document.body.style.webkitUserSelect = 'none';
        document.body.style.msUserSelect = 'none';
        document.body.style.mozUserSelect = 'none';
        
        // Add watermark style
        document.body.style.webkitTouchCallout = 'none';
      });

      // Security notification function
      function showSecurityNotification(message) {
        var alert = document.createElement('div');
        alert.style.cssText = 'position:fixed;top:20px;right:20px;background-color:#dc3545;color:white;padding:15px 20px;border-radius:4px;box-shadow:0 4px 6px rgba(0,0,0,0.3);z-index:10000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;font-size:14px;font-weight:500;max-width:300px;animation:slideIn 0.3s ease-out;';
        alert.textContent = message;

        var style = document.createElement('style');
        style.textContent = '@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }';
        document.head.appendChild(style);

        document.body.appendChild(alert);

        setTimeout(function() {
          alert.style.animation = 'slideIn 0.3s ease-out reverse';
          setTimeout(function() { alert.remove(); }, 300);
        }, 3000);
      }

      // Disable right-click on images
      document.addEventListener('contextmenu', function(e) {
        if (e.target.tagName === 'IMG') {
          e.preventDefault();
          return false;
        }
      });

      // Additional protection: Disable developer tools via shortcut combinations
      var lastKeyCodes = [];
      document.addEventListener('keydown', function(e) {
        lastKeyCodes.push(e.keyCode);
        if (lastKeyCodes.length > 3) lastKeyCodes.shift();
        
        // Detect Ctrl+Shift+K
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'k') {
          e.preventDefault();
          showSecurityNotification('Console access is disabled on this website.');
          return false;
        }
      });
    </script>

    <!-- Watermark Prevention CSS -->
    <style>
      * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -webkit-touch-callout: none;
      }
      
      html, body {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* Prevent drag and drop */
      img {
        pointer-events: none;
        -webkit-user-drag: none;
        user-drag: none;
      }
    </style>

    <!-- site:head-end -->
  </head>
