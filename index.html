<!doctype html>
<html lang="en">
  <head>
    <!-- site:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Security headers: only Content-Security-Policy actually works when
      delivered via a <meta> tag — browsers ignore X-Frame-Options and
      X-Content-Type-Options unless they come from a real HTTP response
      header, which GitHub Pages doesn't let you set. (Those two tags were
      previously here but did nothing — removed rather than leave a false
      sense of protection.) If real clickjacking/MIME-sniffing protection
      is needed later, put a CDN like Cloudflare in front of the site, or
      move hosting to a platform that supports custom headers (e.g.
      Netlify's _headers file, Vercel's vercel.json).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" />

    <!--
      Robots directives are NOT hardcoded here — they're driven by
      .config/site-meta.json (robots.index) via the siteMetaPlugin in
      vite.config.ts, so there's one source of truth instead of two files
      disagreeing about whether the site should be indexed.
    -->
    
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <!--
      NOTE: Confirm this canonical URL matches your actual deployed domain.
    -->
    <link rel="canonical" href="https://nickomcst.github.io/mandaluyong-college-website/" />

    <title>Mandaluyong College of Science and Technology – Unofficial Student Web Project</title>
    <meta name="description" content="Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources." />

    <!-- Open Graph tags for link previews and site name signal -->
    <meta property="og:site_name" content="MCST Unofficial Student Project" />
    <meta property="og:title" content="Mandaluyong College of Science and Technology – Unofficial Student Web Project" />
    <meta property="og:description" content="Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nickomcst.github.io/mandaluyong-college-website/" />

    <!--
      GitHub Pages SPA fallback: when a deep link (e.g. /programs) is opened
      directly or the page is refreshed, GitHub Pages serves public/404.html,
      which redirects here with the intended path encoded in the query
      string. This restores the real URL before React Router mounts. See
      https://github.com/rafgraph/spa-github-pages for the technique.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MCST Unofficial Student Project",
      "alternateName": "Mandaluyong College of Science and Technology – Unofficial Student Web Project",
      "url": "https://nickomcst.github.io/mandaluyong-college-website/",
      "description": "Unofficial student-built website for Mandaluyong College of Science and Technology (MCST) — explore programs, campus life, and student resources.",
      "publisher": {
        "@type": "Person",
        "name": "Nicko"
      },
      "isPartOf": {
        "@type": "CreativeWork",
        "name": "Student Portfolio Project",
        "about": "Mandaluyong College of Science and Technology"
      }
    }
    </script>

    <!-- Security Warning in Console -->
    <script type="text/javascript">
      console.log(
        "%cStop!",
        "color: red; font-size: 60px; font-weight: bold; text-shadow: 1px 1px 0 #000;"
      );
      console.log(
        "%cThis is a browser feature intended for developers. If someone told you to copy-paste something here to enable a feature or \"hack\" an account, it's a scam and could give them access to your account.",
        "font-size: 16px;"
      );
      console.log(
        "%cIf you're a developer curious about this site, contact Nicko (NickoMCST) on GitHub: https://github.com/NickoMCST",
        "font-size: 14px; color: #999;"
      );
      console.log(
        "%c⚠️ SECURITY NOTICE: This website has security protections enabled.",
        "color: #ff6b6b; font-size: 14px; font-weight: bold;"
      );
    </script>

    <!--
      Right-click, text selection, and copy/paste are intentionally left
      enabled — blocking them annoys legitimate visitors (can't open links
      in a new tab, can't select an address to copy) while barely slowing
      down anyone who actually wants your code (View Source / DevTools
      bypass it instantly). The real protection here is that the shipped
      JavaScript bundle is obfuscated at build time (see vite.config.ts),
      so if someone does save the page or inspect the bundle, what they
      get back is scrambled, unreadable code rather than clean source.
    -->
    <script type="text/javascript">
      // Ctrl+S / Cmd+S — saving the page still works (browsers won't let
      // you truly block this), but we let the visitor know the saved
      // copy won't be usable, since the JS is obfuscated at build time.
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          showSecurityNotification('This page can be saved, but the saved copy won\'t work — the code is scrambled for protection.');
          return false;
        }
      }, true);

      function showSecurityNotification(message) {
        var alert = document.createElement('div');
        alert.style.cssText = 'position:fixed;top:20px;right:20px;background-color:#0a1628;color:white;padding:15px 20px;border-radius:4px;box-shadow:0 4px 6px rgba(0,0,0,0.3);z-index:10000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;font-size:14px;font-weight:500;max-width:320px;animation:slideIn 0.3s ease-out;';
        alert.textContent = message;

        if (!document.querySelector('style[data-security-anim]')) {
          var style = document.createElement('style');
          style.setAttribute('data-security-anim', 'true');
          style.textContent = '@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }';
          document.head.appendChild(style);
        }

        document.body.appendChild(alert);

        setTimeout(function() {
          alert.style.animation = 'slideIn 0.3s ease-out reverse';
          setTimeout(function() { alert.remove(); }, 300);
        }, 3000);
      }
    </script>

    <!-- site:head-end -->
  </head>
  <body>
    <!-- site:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- site:body-end -->
  </body>
</html>
