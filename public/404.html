<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages has no server-side routing, so it serves this file for
      any URL it doesn't recognize (e.g. a direct visit or refresh on
      /programs). It re-encodes the path into a query string and redirects
      to index.html, which decodes it back before React Router mounts.
      Technique: https://github.com/rafgraph/spa-github-pages

      pathSegmentsToKeep is 1 because this project is deployed to a GitHub
      Pages *project* page (https://USERNAME.github.io/REPOSITORY-NAME/),
      so the first path segment (the repository name) must be preserved.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
